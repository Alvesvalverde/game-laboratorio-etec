<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Tela 2 - Full HD</title>

<style>
body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.screen {
    width: 1920px;
    height: 1080px;
    background: #f4f4f4;
    display: flex;
    flex-direction: column;
}

/* HEADER */
.header {
    background: #c00000;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
}

.logo img {
    height: 55px;
}

.menu {
    color: white;
    font-size: 32px;
}

/* SUB HEADER */
.sub-header {
    background: #c00000;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    font-size: 26px;
    color: white;
}

/* CONTENT */
.content {
    flex: 1;
    padding: 60px;
}

/* LAYOUT */
.layout {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 40px;
    height: 100%;
}

.big-box {
    background: #c00000;
    border-radius: 20px;
}

.small-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.small-grid div {
    background: #c00000;
    border-radius: 15px;
}
</style>

</head>
<body>

<div class="screen">

    <div class="header">
        <div class="logo">
            <img src="logo.png" alt="Logo Etec">
        </div>

        <div class="menu">☰</div>
    </div>

    <div class="sub-header">
        <div>📄</div>
        <div>💡</div>
    </div>

    <div class="content">
        <div class="layout">

            <div class="big-box"></div>

            <div class="small-grid">
                <div></div><div></div><div></div>
                <div></div><div></div><div></div>
                <div></div><div></div><div></div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
