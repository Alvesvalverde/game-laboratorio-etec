<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Pergunta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <img src="etec-logo.png" alt="ETEC">
        </div>

        <div class="menu">☰</div>
    </header>

    <!-- CONTEÚDO -->
    <main>

        <section class="form-container">

            <h2>ADICIONAR NOVA PERGUNTA</h2>

            <!-- FORM -->
            <form id="formPergunta">

                <!-- TITULO -->
                <div class="form-group">
                    <label>TITULO</label>
                    <input type="text" placeholder="digite aqui..." required>
                </div>

                <!-- IMAGEM -->
                <div class="form-group">
                    <label>IMAGEM</label>
                    <input type="file" accept="image/*">
                </div>

                <!-- RESPOSTA -->
                <div class="form-group">
                    <label>RESPOSTA CORRETA</label>
                    <input type="text" placeholder="digite aqui..." required>
                </div>

                <!-- BOTÃO -->
                <div class="form-actions">
                    <button type="submit">SALVAR PERGUNTA</button>
                </div>

            </form>

        </section>

    </main>

    <script src="pergunta.js"></script>
</body>
</html>
